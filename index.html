<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ziyaretçi Defteri</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f4f4f4; padding: 50px; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); display: inline-block; }
        input { padding: 10px; width: 200px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #218838; }
        ul { list-style: none; padding: 0; margin-top: 20px; }
        li { background: #eee; margin: 5px 0; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Ziyaretçi Listesi</h2>
    <input type="text" id="isimInput" placeholder="Adınızı yazın...">
    <button onclick="ekle()">Ekle</button>
    <ul id="liste"></ul>
</div>

<script>
    // Sayfa açıldığında listeyi otomatik yükle
    window.onload = listele;

    // 1. LİSTELEME FONKSİYONU
    function listele() {
        fetch('/api/ziyaretciler') // Başında http://... yok, sadece yol var.
            .then(res => res.json())
            .then(veriler => {
                const liste = document.getElementById('liste');
                liste.innerHTML = ''; // Listeyi temizle
                veriler.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item.isim;
                    liste.appendChild(li);
                });
            })
            .catch(err => console.error("Liste yüklenemedi:", err));
    }

    // 2. EKLEME FONKSİYONU
    function ekle() {
        const input = document.getElementById('isimInput');
        const isim = input.value;

        if (!isim) {
            alert("Lütfen bir isim yazın!");
            return;
        }

        fetch('/api/kaydet?isim=' + encodeURIComponent(isim)) // Başında http://... yok.
            .then(res => res.json())
            .then(sonuc => {
                console.log("Kaydedildi:", sonuc);
                input.value = ''; // Kutuyu boşalt
                listele(); // Listeyi güncelle
            })
            .catch(err => {
                console.error("Kaydedilemedi:", err);
                alert("Bir hata oluştu. Konsolu (F12) kontrol et.");
            });
    }
</script>

</body>
</html>
