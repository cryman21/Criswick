<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Ziyaretçi Defteri</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #ec4899;
            --bg: #eef2ff;
            --card-bg: rgba(255, 255, 255, 0.95);
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 450px;
            animation: fadeIn 0.6s ease-out;
        }

        h2 { text-align: center; color: #1e293b; margin-bottom: 1.5rem; font-weight: 600; }

        .form-group { display: flex; gap: 10px; margin-bottom: 15px; }

        /* Arama Çubuğu Stili */
        .search-box {
            width: 100%;
            padding: 10px 15px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: #f8fafc;
            outline: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .search-box:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        input[type="text"]#isimInput {
            flex: 1;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]#isimInput:focus { border-color: var(--primary); }

        .btn-add {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4); }

        ul { list-style: none; padding: 0; max-height: 350px; overflow-y: auto; }

        li {
            background: white;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #f1f5f9;
            transition: 0.2s;
        }
        li:hover { transform: scale(1.02); border-color: var(--primary); }

        .info { display: flex; flex-direction: column; }
        .name { font-weight: 600; color: #334155; }
        .date { font-size: 0.75rem; color: #94a3b8; }

        .btn-delete {
            background: #fee2e2;
            color: #ef4444;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.3s;
        }
        .btn-delete:hover { background: #ef4444; color: white; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Scrollbar */
        ul::-webkit-scrollbar { width: 5px; }
        ul::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Ziyaretçi Defteri ✨</h2>

    <div class="form-group">
        <input type="text" id="isimInput" placeholder="Adınızı yazın...">
        <button class="btn-add" onclick="ekle()">Ekle</button>
    </div>

    <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;">

    <input type="text" id="aramaInput" class="search-box" placeholder="Listede ara..." onkeyup="ara()">

    <ul id="liste"></ul>
</div>

<script>
    let tumZiyaretciler = []; // Arama için verileri burada tutacağız

    window.onload = listele;

    function listele() {
        fetch('/api/ziyaretciler')
            .then(res => res.json())
            .then(veriler => {
                tumZiyaretciler = veriler.reverse();
                ekranaBas(tumZiyaretciler);
            });
    }

    function ekranaBas(listeVerisi) {
        const listeElemani = document.getElementById('liste');
        listeElemani.innerHTML = '';
        
        listeVerisi.forEach(item => {
            const li = document.createElement('li');
            li.innerHTML = `
                <div class="info">
                    <span class="name">${item.isim}</span>
                    <span class="date">📅 ${item.tarih || 'Bilinmiyor'}</span>
                </div>
                <button class="btn-delete" onclick="sil(${item.id})">Sil</button>
            `;
            listeElemani.appendChild(li);
        });
    }

    // CANLI ARAMA FONKSİYONU
    function ara() {
        const kelime = document.getElementById('aramaInput').value.toLowerCase();
        const filtrelenmiş = tumZiyaretciler.filter(z => 
            z.isim.toLowerCase().includes(kelime)
        );
        ekranaBas(filtrelenmiş);
    }

    function ekle() {
        const input = document.getElementById('isimInput');
        const isim = input.value.trim();
        if (!isim) return;

        fetch('/api/kaydet?isim=' + encodeURIComponent(isim))
            .then(() => {
                input.value = '';
                listele();
            });
    }

    function sil(id) {
        if (confirm("Silinsin mi?")) {
            fetch('/api/sil?id=' + id).then(() => listele());
        }
    }
</script>

</body>
</html>
