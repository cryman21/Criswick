<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ziyaretçi Takip Sistemi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f8f9fa; }
        .ana-kart { max-width: 600px; margin: 30px auto; }
        .cikis-yapildi { background-color: #e9ecef !important; opacity: 0.8; }
    </style>
</head>
<body>

<div class="container">
    <div class="card ana-kart shadow p-4">
        <h3 class="text-center text-primary mb-4 border-bottom pb-2">Ziyaretçi Takip Sistemi</h3>
        
        <div class="input-group mb-3">
            <input type="text" id="isimKutusu" class="form-control" placeholder="İsim soyisim..." onkeypress="if(event.key === 'Enter') kaydet()">
            <button class="btn btn-primary" onclick="kaydet()">Ekle</button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <input type="text" id="aramaKutusu" class="form-control form-control-sm w-50" placeholder="Ara..." onkeyup="listeyiFiltrele()">
            <span class="badge bg-dark">Toplam: <span id="toplamSayac">0</span></span>
        </div>

        <ul id="ziyaretciListesi" class="list-group"></ul>
    </div>
</div>

<script>
    let anaListe = [];

    async function verileriCek() {
        const cevap = await fetch('http://127.0.0.1:3000/api/kaydet');
        const veri = await cevap.json();
        anaListe = veri.toplamListe || [];
        listeyiCiz(anaListe);
        sayacGuncelle();
    }

    function listeyiCiz(liste) {
        const listeAlani = document.getElementById('ziyaretciListesi');
        listeAlani.innerHTML = "";

        liste.forEach(item => {
            const li = document.createElement('li');
            // Eğer çıkış yapılmışsa farklı tasarım uygula
            li.className = `list-group-item d-flex justify-content-between align-items-center mb-2 shadow-sm rounded ${item.cikis_saati ? 'cikis-yapildi' : ''}`;
            
            let sagTaraf = "";
            if (item.cikis_saati) {
                sagTaraf = `<small class="text-danger fw-bold">Çıkış: ${item.cikis_saati.split(' ')[1]}</small>`;
            } else {
                sagTaraf = `<button class="btn btn-warning btn-sm" onclick="cikisYap(${item.id})">Çıkış Yap</button>`;
            }

            li.innerHTML = `
                <div>
                    <strong>${item.isim}</strong> <br>
                    <small class="text-muted">Giriş: ${item.tarih.split(' ')[1]}</small>
                </div>
                <div>${sagTaraf}</div>
            `;
            listeAlani.appendChild(li);
        });
    }

    async function kaydet() {
        const kutu = document.getElementById('isimKutusu');
        if (kutu.value.trim() === "") return;
        const cevap = await fetch(`http://127.0.0.1:3000/api/kaydet?isim=${encodeURIComponent(kutu.value)}`);
        const veri = await cevap.json();
        anaListe = veri.toplamListe;
        listeyiCiz(anaListe);
        sayacGuncelle();
        kutu.value = "";
    }

    async function cikisYap(id) {
        const cevap = await fetch(`http://127.0.0.1:3000/api/cikis-yap?id=${id}`);
        const veri = await cevap.json();
        anaListe = veri.toplamListe;
        listeyiCiz(anaListe);
    }

    async function sayacGuncelle() {
        const cevap = await fetch('http://127.0.0.1:3000/api/istatistik');
        const veri = await cevap.json();
        document.getElementById('toplamSayac').innerText = veri.toplam;
    }

    function listeyiFiltrele() {
        const kelime = document.getElementById('aramaKutusu').value.toLowerCase();
        const filtrelenmis = anaListe.filter(i => i.isim.toLowerCase().includes(kelime));
        listeyiCiz(filtrelenmis);
    }

    window.onload = verileriCek;
</script>
</body>
</html>
